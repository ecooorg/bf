name: Emergency restore immofinderCore
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore server/immofinderCore.ts from last green commit
        run: |
          set -euo pipefail
          git show 10d675b899b3bbf270f3ff9807545b023c098247:server/immofinderCore.ts > server/immofinderCore.ts
          wc -c server/immofinderCore.ts
          test "$(wc -c < server/immofinderCore.ts)" -gt 60000
          grep -q 'export function credibilityRejectReason' server/immofinderCore.ts
          git config user.name "ecooorg"
          git config user.email "ecooorg@gmail.com"
          git add server/immofinderCore.ts
          git commit -m "revert(immofinder): restore full immofinderCore.ts from 10d675b" || echo "no change"
          git push origin HEAD:main
