name: restore-pipeline-p13010a
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore pipeline from good commit and fix text scope
        run: |
          set -euo pipefail
          curl -sL "https://raw.githubusercontent.com/ecooorg/bf/638c07113cba5a0e87adbb5e9888c7171ec8e4cb/server/immofinderPipeline.ts" -o server/immofinderPipeline.ts
          sed -i 's/placeFromTitleOrSnippet(meta\.title, text\.slice(0, 600)/placeFromTitleOrSnippet(meta.title, pages[i].text.slice(0, 600)/g' server/immofinderPipeline.ts
          grep -n 'pages\[i\]\.text\.slice(0, 600)' server/immofinderPipeline.ts
          grep -q 'export async function runPipeline' server/immofinderPipeline.ts
          wc -c server/immofinderPipeline.ts
      - name: Patch version and CHANGELOG
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pj = JSON.parse(fs.readFileSync("package.json","utf8"));
            pj.patch = "130.10a";
            fs.writeFileSync("package.json", JSON.stringify(pj, null, 2) + "\n");
            let lock = fs.readFileSync("package-lock.json","utf8");
            lock = lock.replace(/"patch": "130\.10"/g, "\"patch\": \"130.10a\"");
            fs.writeFileSync("package-lock.json", lock);
          '
          printf '%s\n' '## P130.10a — Restore pipeline + fix undefined text in geo prefilter' '' '- **PROBLEM:** Core CI typecheck/build failed after P130.10: text not in scope in post-extraction loop; pipeline was left as placeholder; per-patch apply scripts violated scripts-integrity.' '- **CHANGE:** restore pipeline from 638c071, use pages[i].text for geo prefilter; remove forbidden apply-p130* scripts. BUGFIX.' '' > /tmp/entry.md
          cat /tmp/entry.md CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
      - name: Commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderPipeline.ts package.json package-lock.json CHANGELOG.md
          git commit -m "fix(immofinder): P130.10a restore pipeline, geo text scope, remove apply scripts" || true
          git push origin HEAD:main
