name: acceptance
# Browser-only acceptance. Deterministic unit, DB and build checks are owned by ci.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'tests/*e2e*.test.mjs'
      - 'tests/*browser*.test.mjs'
      - '.github/workflows/acceptance.yml'
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-acceptance:
    name: Browser acceptance (UI and primary user flows)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/acceptance
          npm run typecheck 2>&1 | tee artifacts/acceptance/typecheck.log
          npm run build 2>&1 | tee artifacts/acceptance/build.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance
        shell: bash
        run: set -o pipefail; npm run test:ui 2>&1 | tee artifacts/acceptance/browser-tests.log
      - name: Canonical diagnostics report
        if: always()
        run: node scripts/diagnostics-report.mjs
        env:
          DIAGNOSTICS_DIR: artifacts/diagnostics/acceptance
          CI_STATUS: ${{ job.status }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics
          path: |
            artifacts/diagnostics/acceptance/
            artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 30
