name: Core CI — Full Project Verification
on:
  push:
    branches: [main]
    # Snapshot/diagnostics-only commits must not burn a full verification DAG.
    paths-ignore:
      - 'data/immofinder/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/immofinder/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biforge
          POSTGRES_PASSWORD: biforge_test_password
          POSTGRES_DB: biforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biforge -d biforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Prepare log directory
        run: mkdir -p artifacts/ci-checks
      - name: Preflight (current files, scripts, version)
        shell: bash
        run: set -o pipefail; CI_LOGS_DIR=artifacts/ci-checks node scripts/workflow-preflight.mjs
      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

      - name: Install dependencies
        id: deps
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          start=$SECONDS
          npm ci --no-audit --no-fund 2>&1 | tee artifacts/ci-checks/01-dependencies.log
          status=${PIPESTATUS[0]}
          echo "npm ci duration: $((SECONDS-start))s; exit: ${status}" | tee -a artifacts/ci-checks/01-dependencies.log
          exit "$status"

      # One verification DAG (docs/verification-manifest.json, profile ci): critical probes, category suites,
      # db-migrate when DAG_TEST_DATABASE_URL is set, and production build. No per-patch or retired no-op test scripts.
      - name: Verification DAG
        id: dag
        if: steps.deps.outcome == 'success'
        timeout-minutes: 60
        shell: bash
        run: |
          set -o pipefail
          start=$SECONDS
          node scripts/run-dag.mjs --profile ci 2>&1 | tee artifacts/ci-checks/02-verification-dag.log
          status=${PIPESTATUS[0]}
          echo "Verification DAG duration: $((SECONDS-start))s; exit: ${status}" | tee -a artifacts/ci-checks/02-verification-dag.log
          exit "$status"
        env:
          DAG_ALLOW_UNSAFE: 'true'
          DAG_TEST_DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test

      - name: Scan repository for leaked secrets
        if: always() && steps.deps.outcome == 'success'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture CI metrics and recent run history
        if: always()
        shell: bash
        run: node scripts/ci-run-history.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Generate CI patch evidence report
        if: always()
        shell: bash
        run: node scripts/patch-quality-report.mjs
        env:
          CI_STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DAG_OUTCOME: ${{ steps.dag.outcome }}

      - name: Evidence gate (fail closed)
        if: always()
        shell: bash
        run: node scripts/ci-evidence-gate.mjs


      - name: Generate unified diagnostic report
        if: always()
        shell: bash
        run: |
          node scripts/diagnostics-summary.mjs
          if [ -f artifacts/ci-checks/ASSISTANT_SUMMARY.md ]; then cat artifacts/ci-checks/ASSISTANT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi
        env:
          CI_LOGS_DIR: artifacts/ci-checks
          WORKFLOW_RERUN: 'npm run check'
          CI_STATUS: ${{ job.status }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: CI PATCH EVIDENCE — GitHub Actions summary
        if: always()
        run: node scripts/ci-summary.mjs
        env:
          CI_STATUS: ${{ job.status }}

      - name: Print final CI patch evidence report
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/ci-checks/BIForge-PATCH-EVIDENCE.md ]; then
            cat artifacts/ci-checks/BIForge-PATCH-EVIDENCE.md
          elif [ -f artifacts/ci-checks/PATCH_EVIDENCE.md ]; then
            cat artifacts/ci-checks/PATCH_EVIDENCE.md
          else
            echo 'BIForge-PATCH-EVIDENCE.md unavailable; inspect CI report-generation errors above.'
          fi

      - name: Upload complete CI report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics
          path: |
            artifacts/ci-checks/ASSISTANT_SUMMARY.md
            artifacts/ci-checks/*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  immofinder-live-acceptance:
    # A one-shot production search is opt-in by commit message and runs only after the full Core CI job succeeds.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[immofinder-live]') }}
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Health-check and start one bounded source-first production run
        id: run
        env:
          BASE_URL: https://bf-3tqo.onrender.com
          RUN_SECRET: ${{ secrets.IMMOFINDER_RUN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RUN_SECRET:?Missing IMMOFINDER_RUN_SECRET}"
          BASE="${BASE_URL%/}"
          EXPECTED_COMMIT="${GITHUB_SHA:0:7}"
          deployed=false
          for attempt in $(seq 1 60); do
            health_code=$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/health.json -w '%{http_code}' "$BASE/health" || true)
            if [ "$health_code" = "200" ] && jq -e --arg expected "$EXPECTED_COMMIT" '.status == "ok" and .commit == $expected' /tmp/health.json >/dev/null 2>&1; then
              deployed=true
              break
            fi
            sleep 10
          done
          if [ "$deployed" != true ]; then
            echo "Production has not deployed expected commit $EXPECTED_COMMIT within 600 seconds." >&2
            cat /tmp/health.json || true
            exit 1
          fi
          echo "Production health: HTTP 200, commit $EXPECTED_COMMIT"
          code=$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/trigger.json -w '%{http_code}' -X POST "$BASE/api/immofinder/run" \
            -H "X-Immofinder-Secret: $RUN_SECRET" -H 'Content-Type: application/json' --data '{"wave":"full","manualRun":true}')
          if [ "$code" != "202" ]; then
            jq '{success,error,code}' /tmp/trigger.json 2>/dev/null || cat /tmp/trigger.json
            echo "Production search was not queued: HTTP $code" >&2
            exit 1
          fi
          RUN_ID=$(jq -r '.runId // empty' /tmp/trigger.json)
          if [ -z "$RUN_ID" ]; then echo "No runId returned by production API." >&2; exit 1; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Started bounded source-first production run: $RUN_ID"
          completed=false
          for attempt in $(seq 1 60); do
            sleep 10
            status=$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/report.json -w '%{http_code}' "$BASE/api/immofinder/diagnostics/latest" -H "X-Immofinder-Secret: $RUN_SECRET" || true)
            if [ "$status" = "200" ] && jq -e --arg id "$RUN_ID" '.success == true and .report.runId == $id and (.report.result.status == "COMPLETED" or .report.result.status == "INFRA_FAIL")' /tmp/report.json >/dev/null 2>&1; then
              completed=true
              break
            fi
          done
          if [ "$completed" != true ]; then
            echo "Run $RUN_ID did not produce completed diagnostics within 600 seconds." >&2
            exit 1
          fi
          mkdir -p artifacts/immofinder-live
          jq '{
            runId: .report.runId,
            completedAt: .report.completedAt,
            status: .report.result.status,
            counts: .report.result.counts,
            filtered: .report.result.filtered,
            sourceStats: .report.result.sourceStats,
            estimatedProviderCostUsd: .report.result.estCostUsd,
            qualityLevels: {
              L1: ([.report.result.preview[]? | select(.kept == true and .detail == "L1")] | unique_by(.url) | length),
              L2: ([.report.result.preview[]? | select(.kept == true and .detail == "L2")] | unique_by(.url) | length)
            },
            leadEvidence: ([.report.result.preview[]? | select(.kept == true) | {source,municipality,rooms,level:.detail}] | unique),
            providerCalls: {
              serper: (.report.result.counts.serper_calls // 0),
              gemini: (.report.result.counts.gemini_calls // 0)
            },
            errors: ([.report.result.errors[]? | {source,code}])
          }' /tmp/report.json > artifacts/immofinder-live/summary.json
          L1=$(jq -r '.qualityLevels.L1' artifacts/immofinder-live/summary.json)
          L2=$(jq -r '.qualityLevels.L2' artifacts/immofinder-live/summary.json)
          TOTAL=$((L1 + L2))
          {
            echo "### ImmoFinder production live acceptance"
            echo "- Run: $RUN_ID"
            echo "- L1 leads: $L1"
            echo "- L2 private-owner leads: $L2"
            echo "- Total kept leads: $TOTAL (acceptance minimum: 3)"
            echo "- Fetched detail pages: $(jq -r '.counts.fetched // 0' artifacts/immofinder-live/summary.json)"
            echo "- Serper/Gemini calls: $(jq -r '.providerCalls.serper' artifacts/immofinder-live/summary.json)/$(jq -r '.providerCalls.gemini' artifacts/immofinder-live/summary.json)"
            echo "- Estimated provider cost: USD $(jq -r '.estimatedProviderCostUsd // 0' artifacts/immofinder-live/summary.json)"
            echo "- Source stats: `$(jq -c '.sourceStats' artifacts/immofinder-live/summary.json)`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -lt 3 ]; then
            echo "Live acceptance failed: fewer than 3 unique L1/L2 results." >&2
            exit 1
          fi
      - name: Upload sanitized live acceptance summary
        if: always() && steps.run.outputs.run_id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immofinder-live-acceptance-${{ steps.run.outputs.run_id }}
          path: artifacts/immofinder-live/summary.json
          if-no-files-found: warn
          retention-days: 14
