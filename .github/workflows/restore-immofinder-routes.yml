name: restore-immofinder-routes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/trigger-restore-routes'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and commit fixed routes
        run: |
          set -euo pipefail
          URL='https://tmpfiles.org/dl/1795736254.8dc6d534d09ecc09/wdAWvOTIr5Th/routes.fixed2.ts'
          curl -sSL --max-time 60 -o server/immofinderRoutes.ts "$URL"
          wc -c server/immofinderRoutes.ts
          grep -q "req.path === '/settings'" server/immofinderRoutes.ts
          grep -q 'registerImmoFinderRoutes' server/immofinderRoutes.ts
          git config user.name 'immofinder-restore'
          git config user.email 'bot@users.noreply.github.com'
          git add server/immofinderRoutes.ts
          git commit -m 'fix(immofinder): secret PUT short path /settings' || echo 'no change'
          git push origin HEAD:main
