name: Ensure repair module
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore repair/store modules from payload
        run: node scripts/ensure-repair.mjs
      - name: Commit restored/synced files if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add server/immofinderRepair.ts server/immofinderStore.ts package-lock.json
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: restore repair/store modules from payload'
            git push
          fi
