name: P118 architect live

on:
  workflow_dispatch:
    inputs:
      goal:
        description: Software task for the live build (empty uses the built-in library-app task)
        required: false
        default: ''
        type: string
      cleanup:
        description: Delete the evidence projects this run created
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: p118-architect-live
  cancel-in-progress: false

jobs:
  architect-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - name: Run task-to-ZIP scenario and refusal controls
        env:
          STAGING_SERVICE_URL: ${{ secrets.STAGING_SERVICE_URL }}
          STAGING_APP_PASSWORD: ${{ secrets.STAGING_APP_PASSWORD }}
          P118_GOAL: ${{ inputs.goal }}
          P118_CLEANUP: ${{ inputs.cleanup }}
        run: node scripts/p118-architect-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p118-architect-live
          path: p118-live/
          if-no-files-found: warn
          retention-days: 14
