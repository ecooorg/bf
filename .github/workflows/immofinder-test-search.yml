name: ImmoFinder source-first production run
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: immofinder-source-first-production
  cancel-in-progress: false
jobs:
  production-run:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/immofinder-run')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Trigger one bounded source-first production run
        id: trigger
        env:
          BASE_URL: https://bf-3tqo.onrender.com
          RUN_SECRET: ${{ secrets.IMMOFINDER_RUN_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$RUN_SECRET" ]; then
            echo "Missing production base URL or run secret." >&2
            exit 1
          fi
          BASE="${BASE_URL%/}"
          before=$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/before.json -w '%{http_code}' "$BASE/api/immofinder/diagnostics/latest" -H "X-Immofinder-Secret: $RUN_SECRET" || true)
          before_id=""
          if [ "$before" = "200" ]; then before_id=$(jq -r '.report.runId // empty' /tmp/before.json); fi
          code=$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/trigger.json -w '%{http_code}' -X POST "$BASE/api/immofinder/run" \
            -H "X-Immofinder-Secret: $RUN_SECRET" -H 'Content-Type: application/json' \
            --data '{"wave":"full"}')
          if [ "$code" = "409" ]; then
            gh api "repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Source-first production run was not started: another search is already running. No production data was changed."
            exit 0
          fi
          if [ "$code" != "202" ]; then
            jq '{success,error,code}' /tmp/trigger.json 2>/dev/null || cat /tmp/trigger.json
            echo "Unexpected production-run response: HTTP $code" >&2
            exit 1
          fi
          RUN_ID=$(jq -r '.runId // empty' /tmp/trigger.json)
          if [ -z "$RUN_ID" ]; then echo "No runId returned." >&2; exit 1; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Started source-first production run $RUN_ID (previous report: ${before_id:-none})."
          found=false
          for attempt in $(seq 1 60); do
            sleep 10
            status=$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/report.json -w '%{http_code}' "$BASE/api/immofinder/diagnostics/latest" -H "X-Immofinder-Secret: $RUN_SECRET" || true)
            if [ "$status" = "200" ] && jq -e --arg id "$RUN_ID" '.success == true and .report.runId == $id' /tmp/report.json >/dev/null 2>&1; then found=true; break; fi
          done
          if [ "$found" != true ]; then
            gh api "repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Source-first production run $RUN_ID was accepted but no completed diagnostics report appeared within 600 seconds. Check Render worker logs."
            exit 1
          fi
          mkdir -p artifacts
          cp /tmp/report.json "artifacts/immofinder-production-$RUN_ID.json"
          jq '{
            runId: .report.runId,
            completedAt: .report.completedAt,
            counts: .report.result.counts,
            filtered: .report.result.filtered,
            sourceStats: .report.result.sourceStats,
            estimatedProviderCostUsd: .report.result.estCostUsd,
            qualityLevels: {
              L1: ([.report.result.preview[]? | select(.kept == true and .detail == "L1")] | length),
              L2: ([.report.result.preview[]? | select(.kept == true and .detail == "L2")] | length)
            },
            paidProviderCalls: { serper: (.report.result.counts.serper_calls // 0), gemini: (.report.result.counts.gemini_calls // 0), jina: 0, browser: 0 },
            errors: ([.report.result.errors[]? | {source,code}])
          }' /tmp/report.json > /tmp/summary.json
          summary=$(jq -r '"**Source-first production run completed**
- Run: (.runId)
- Detail pages fetched: (.counts.fetched // 0)
- L1 leads: (.qualityLevels.L1)
- L2 private-owner leads: (.qualityLevels.L2)
- New records: (.counts.new // 0)
- Rejections: (.filtered)
- Estimated provider cost: $(.estimatedProviderCostUsd // 0)
- Paid provider calls (Serper/Gemini/Jina/browser): \(.paidProviderCalls.serper)/\(.paidProviderCalls.gemini)/\(.paidProviderCalls.jina)/\(.paidProviderCalls.browser)
- Errors: ([.errors[]?.code] | join(", "))"' /tmp/summary.json)
          gh api "repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$summary"
      - name: Upload production diagnostics
        if: always() && steps.trigger.outputs.run_id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immofinder-source-first-production-${{ steps.trigger.outputs.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
