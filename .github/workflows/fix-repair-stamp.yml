name: fix-repair-stamp
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Align REPAIR_RULES_VERSION and p0 assertion
        run: |
          set -euo pipefail
          sed -i "s/export const REPAIR_RULES_VERSION = '130.10.0'/export const REPAIR_RULES_VERSION = '130.10a.5'/" server/immofinderRepair.ts
          sed -i "s/assert.equal(REPAIR_RULES_VERSION, '130.5a.5')/assert.equal(REPAIR_RULES_VERSION, '130.10a.5')/" tests/immofinder-p0.test.mjs
          grep -n "REPAIR_RULES_VERSION" server/immofinderRepair.ts | head -3
          grep -n "REPAIR_RULES_VERSION" tests/immofinder-p0.test.mjs | head -5
          # quality test derives from package.json patch — verify
          node -e "const p=require('./package.json'); console.log('expected quality', p.patch+'.5')"
      - name: Commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderRepair.ts tests/immofinder-p0.test.mjs
          git commit -m "fix(immofinder): P130.10a align REPAIR_RULES_VERSION to 130.10a.5" || true
          git push origin HEAD:main
