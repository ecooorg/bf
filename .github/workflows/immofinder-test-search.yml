name: ImmoFinder agent short test search
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: immofinder-agent-test
  cancel-in-progress: false
jobs:
  bounded-test:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/immofinder-test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger a bounded dry-run against production
        id: trigger
        env:
          BASE_URL: ${{ secrets.IMMOFINDER_BASE_URL }}
          RUN_SECRET: ${{ secrets.IMMOFINDER_RUN_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$RUN_SECRET" ]; then
            echo "Missing IMMOFINDER_BASE_URL or IMMOFINDER_RUN_SECRET repository secret." >&2
            exit 1
          fi
          BASE="${BASE_URL%/}"
          before=$(curl -sS -o /tmp/before.json -w '%{http_code}' "$BASE/api/immofinder/diagnostics/latest" -H "X-Immofinder-Secret: $RUN_SECRET" || true)
          before_id=""
          if [ "$before" = "200" ]; then before_id=$(jq -r '.report.runId // empty' /tmp/before.json); fi
          code=$(curl -sS -o /tmp/trigger.json -w '%{http_code}' -X POST "$BASE/api/immofinder/run" \
            -H "X-Immofinder-Secret: $RUN_SECRET" -H 'Content-Type: application/json' \
            -d '{"dryRun":true,"wave":"carousel","testMode":true}')
          if [ "$code" = "409" ]; then
            gh api "repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Short ImmoFinder test was not started: another search is already running. No production data was changed."
            exit 0
          fi
          if [ "$code" != "202" ]; then
            cat /tmp/trigger.json
            echo "Unexpected trigger response: HTTP $code" >&2
            exit 1
          fi
          RUN_ID=$(jq -r '.runId // empty' /tmp/trigger.json)
          if [ -z "$RUN_ID" ]; then echo "No runId returned." >&2; exit 1; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered bounded test run $RUN_ID (previous diagnostics: ${before_id:-none})."
          found=false
          for attempt in $(seq 1 20); do
            sleep 8
            status=$(curl -sS -o /tmp/report.json -w '%{http_code}' "$BASE/api/immofinder/diagnostics/latest" -H "X-Immofinder-Secret: $RUN_SECRET" || true)
            if [ "$status" = "200" ] && jq -e --arg id "$RUN_ID" '.report.runId == $id' /tmp/report.json >/dev/null; then found=true; break; fi
          done
          if [ "$found" != true ]; then
            gh api "repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Bounded ImmoFinder test $RUN_ID was accepted but no completed diagnostics report appeared within 160 seconds. Check the Render worker logs. The run is dry-run-only."
            exit 1
          fi
          mkdir -p artifacts
          cp /tmp/report.json artifacts/immofinder-test-$RUN_ID.json
          summary=$(jq -r '"**ImmoFinder short test completed**\n- Run: \(.report.runId)\n- Candidates: \(.report.result.counts.candidates // 0)\n- Pages fetched: \(.report.result.counts.fetched // 0)\n- Kept (dry-run preview): \(.report.result.counts.kept // 0)\n- Serper queries: \(.report.result.counts.search_queries // 0)\n- Estimated cost: $\(.report.result.estCostUsd // "not reported")\n- Errors: \([.report.result.errors[]?.code] | join(", "))\n- Diagnostics event count: \(.report.eventCount)\n\nNo listing rows or seen-cache entries are written by this test mode. Full report is attached as a workflow artifact."' /tmp/report.json)
          gh api "repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$summary"
      - name: Upload short-search diagnostics
        if: always() && steps.trigger.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: immofinder-short-test-${{ steps.trigger.outputs.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
