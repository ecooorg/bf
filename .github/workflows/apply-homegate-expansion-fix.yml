name: apply-homegate-expansion-fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-homegate-expansion-fix.mjs
      - name: commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderPipeline.ts server/immofinderCore.ts server/immofinderRepair.ts package.json package-lock.json CHANGELOG.md
          git diff --cached --stat
          git commit -m "fix(immofinder): P130.10d Homegate bare-id expansion + SERP rooms + unavailable" || echo no-change
          git push
