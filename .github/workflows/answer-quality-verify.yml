# P125.5 — Unified answer-quality verification (C125 complete)
# Consolidates offline coverage previously split across carousel-verify and information-quality.
name: Answer Quality — Routing, Search, Carousel and Replay

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run live Gemini/search smoke (requires repository secrets)'
        type: boolean
        default: false
      weather_place:
        description: 'Optional place for live weather smoke'
        type: string
        default: ''
  pull_request:
    paths:
      - 'server/webSearch.ts'
      - 'server/nationalAuthorities.ts'
      - 'server/queryFidelity.ts'
      - 'server/sourcePolicy.ts'
      - 'server/modelCarousel.ts'
      - 'server/conversationDiagnostics.ts'
      - 'server.ts'
      - 'config/**'
      - 'tests/p125-*.test.mjs'
      - 'tests/p124-*.test.mjs'
      - 'tests/p123-carousel-workflow.test.mjs'
      - 'scripts/carousel-*.mjs'
      - '.github/workflows/answer-quality-verify.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: answer-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  MODEL_MIN_INTERVAL_MS: '0'

jobs:
  offline-suite:
    name: Offline answer-quality + carousel deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          npm ci --ignore-scripts
      - name: P125 answer-quality pure suite
        run: |
          set -o pipefail
          MODEL_MIN_INTERVAL_MS=0 node --import tsx --test --test-timeout=60000 \
            tests/p125-1-query-fidelity-source-policy.test.mjs \
            tests/p125-3-search-routing-grounding.test.mjs \
            tests/p125-4-answer-quality-suite.test.mjs
      - name: Search and carousel unit tests
        run: |
          set -o pipefail
          MODEL_MIN_INTERVAL_MS=0 node --import tsx --test --test-timeout=60000 \
            tests/p124-28-search-planner.test.mjs \
            tests/p124-38-search-trigger-coverage.test.mjs \
            tests/p124-39-source-quality.test.mjs \
            tests/p124-29-weather-connector.test.mjs \
            tests/p124-30-search-carousel.test.mjs \
            tests/p123-carousel-workflow.test.mjs
      - name: Deterministic carousel verification
        run: |
          set -o pipefail
          node scripts/carousel-verify.mjs || { echo "Deterministic carousel verification failed"; exit 1; }
      - name: Render runtime contract probe
        run: |
          set -o pipefail
          node scripts/carousel-render-probe.mjs || { echo "Render runtime contract probe failed"; exit 1; }
      - name: National authorities data loads
        run: |
          set -o pipefail
          node --import tsx -e "import { loadNationalAuthorities } from './server/nationalAuthorities.ts'; const a=loadNationalAuthorities(); if(a.length<5) process.exit(1); console.log('authorities', a.length);"

  live-smoke:
    name: Live carousel + search smoke (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: offline-suite
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          npm ci --ignore-scripts
      - name: Live carousel smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          CAROUSEL_LIVE: 'true'
          WEATHER_PLACE: ${{ inputs.weather_place }}
        run: |
          set -o pipefail
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$SERPER_API_KEY" ]; then
            echo "No live secrets; NOT_RUN"
            exit 0
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            node --import tsx scripts/carousel-live-smoke.mjs || echo "Live smoke non-zero"
          fi
          echo "Production multi-turn OBSERVED remains Navigator after deploy (patch must match package.json)."
