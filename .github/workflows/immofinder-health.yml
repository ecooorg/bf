name: ImmoFinder health
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  checks: read
  issues: write
concurrency:
  group: immofinder-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Collect Render and GitHub Actions logs
        continue-on-error: true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: tea-dbbjfi7avr4c73e32e8g
          RENDER_SERVICE_ID: srv-dc2joprrjlhs73cuo3n0
          RENDER_POSTGRES_ID: dpg-dc2jq267bikc738t6u30-a
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RENDER_LOG_LOOKBACK_MINUTES: '180'
          PLATFORM_LOGS_DIR: artifacts/platform-logs
        run: node scripts/collect-platform-logs.mjs
      - name: Check GitHub, Render and the latest search run
        env:
          IMMOFINDER_BASE_URL: ${{ secrets.IMMOFINDER_BASE_URL }}
          IMMOFINDER_RUN_SECRET: ${{ secrets.IMMOFINDER_RUN_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLATFORM_LOGS_DIR: artifacts/platform-logs
          HEALTH_REPORT_DIR: artifacts/health
          HEALTH_OPEN_ISSUE: 'true'
          HEALTH_SNAPSHOT_DIR: data/immofinder/health
        run: node scripts/immofinder-health-check.mjs
      - name: Commit health snapshot to the repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f data/immofinder/health/latest.json ] || { echo "No snapshot produced."; exit 0; }
          cp data/immofinder/health/latest.json /tmp/health-latest.json
          sig() { jq -c '[.verdict, [.checks[] | [.name, .status, .detail]]]' "$1" 2>/dev/null || echo none; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            old=$(git show origin/main:data/immofinder/health/latest.json > /tmp/health-old.json 2>/dev/null && sig /tmp/health-old.json || echo none)
            new=$(sig /tmp/health-latest.json)
            if [ "$old" = "$new" ] && [ -f /tmp/health-old.json ] && [ "$(date -u -d "$(jq -r .generatedAt /tmp/health-old.json)" +%s)" -gt "$(( $(date -u +%s) - 86400 ))" ]; then
              echo "Health snapshot unchanged and under 24 h old; not committing."; exit 0
            fi
            mkdir -p data/immofinder/health
            cp /tmp/health-latest.json data/immofinder/health/latest.json
            git add data/immofinder/health/latest.json
            git commit -m "chore(immofinder): health snapshot [skip render] [skip ci]"
            if git push origin HEAD:main; then echo "Health snapshot published."; exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Could not publish the health snapshot (branch protection or concurrent pushes)."; exit 1
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immofinder-health-${{ github.run_id }}
          path: artifacts/health/
          if-no-files-found: warn
          retention-days: 30
