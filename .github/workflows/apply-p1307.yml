name: apply-p1307
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-p1307-immofinder.mjs
      - name: Commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderCore.ts server/immofinderDiscovery.ts server/immofinderPipeline.ts package.json package-lock.json CHANGELOG.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "fix(immofinder): P130.7 Homegate detail titles + FR pièces rooms fallback"
          git push
