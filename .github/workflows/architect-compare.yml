# Lab vs Legacy live compare on staging. One assistant summary plus readable logs.
name: Architect — Lab vs Legacy Comparison
on:
  workflow_dispatch:
    inputs:
      goal:
        description: Optional goal (empty = expense fixture)
        required: false
        default: ''
        type: string
      cleanup:
        description: Delete temporary projects after run
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: architect-compare
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare logs
        run: mkdir -p artifacts/ci-checks
      - name: Install
        shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee artifacts/ci-checks/01-compare-dependencies.log
      - name: Dual compare Lab vs Legacy
        id: dual
        shell: bash
        run: set -o pipefail; node scripts/architect-dual-compare.mjs 2>&1 | tee artifacts/ci-checks/02-architect-lab-vs-legacy.log
        env:
          STAGING_SERVICE_URL: ${{ secrets.STAGING_SERVICE_URL }}
          STAGING_APP_PASSWORD: ${{ secrets.STAGING_APP_PASSWORD }}
          DUAL_GOAL: ${{ inputs.goal }}
          DUAL_CLEANUP: ${{ inputs.cleanup }}
          DUAL_OUT_DIR: artifacts/ci-checks/dual-compare
          DUAL_BUILD_WAIT_MS: '600000'
      - name: Generate unified diagnostic report
        if: always()
        shell: bash
        run: node scripts/diagnostics-summary.mjs
        env:
          CI_LOGS_DIR: artifacts/ci-checks
          DUAL_OUT_DIR: artifacts/ci-checks/dual-compare
          CI_STATUS: ${{ job.status }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Upload compare report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architect-compare-diagnostics
          path: |
            artifacts/ci-checks/ASSISTANT_SUMMARY.md
            artifacts/ci-checks/*.log
          if-no-files-found: warn
          retention-days: 30
