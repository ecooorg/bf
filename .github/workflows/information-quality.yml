name: Information Quality — Conversational and Evidence

on:
  workflow_dispatch:
    inputs:
      evaluation_file:
        description: 'Optional repository-relative JSON/JSONL file with blind-review scores for the seven quality dimensions'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - 'server.ts'
      - 'server/**'
      - 'src/**'
      - 'appBuilder/**'
      - 'scripts/information-quality-eval.mjs'
      - 'tests/p120-conversational-e2e.test.mjs'
      - 'tests/p120-expert-e2e.test.mjs'
      - 'tests/p120-architect-e2e.test.mjs'
      - 'tests/*information-quality*.test.mjs'
      - 'docs/INFORMATION_QUALITY_WORKFLOW.md'
      - '.github/workflows/information-quality.yml'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: information-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  MODEL_MIN_INTERVAL_MS: '0'

jobs:
  deterministic-quality:
    name: '${{ matrix.mode }} — deterministic browser acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Simple
            test_file: tests/p120-conversational-e2e.test.mjs
          - mode: Expert
            test_file: tests/p120-expert-e2e.test.mjs
          - mode: Architect
            test_file: tests/p120-architect-e2e.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Run mode-specific browser acceptance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "artifacts/information-quality/${{ matrix.mode }}"
          node --import tsx --test --test-timeout=300000 "${{ matrix.test_file }}" \
            2>&1 | tee "artifacts/information-quality/${{ matrix.mode }}/browser-test.tap"
      - name: Upload mode evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: information-quality-${{ matrix.mode }}
          path: artifacts/information-quality/**
          if-no-files-found: warn
          retention-days: 21

  evaluator-contracts:
    name: Evaluator and information-quality contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run evaluator and Architect information-quality tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/information-quality/evaluator-contracts
          node --import tsx --test \
            tests/information-quality-eval.test.mjs \
            tests/app-builder-information-quality.test.mjs \
            2>&1 | tee artifacts/information-quality/evaluator-contracts/contracts.tap
      - name: Run web evidence and epistemic regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/information-quality/evaluator-contracts
          node --import tsx --test --test-timeout=120000 tests/web-and-epistemics.test.mjs \
            2>&1 | tee artifacts/information-quality/evaluator-contracts/web-epistemics.tap
      - name: Evaluate optional blind-review file
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_file != '' }}
        env:
          EVALUATION_FILE: ${{ inputs.evaluation_file }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVALUATION_FILE" in
            /*|*..*) echo "::error::evaluation_file must be a safe repository-relative path"; exit 2 ;;
          esac
          test -f "$EVALUATION_FILE" || { echo "::error::Evaluation file not found: $EVALUATION_FILE"; exit 2; }
          mkdir -p artifacts/information-quality
          node scripts/information-quality-eval.mjs \
            --input "$EVALUATION_FILE" \
            --out artifacts/information-quality/blind-review-report.json
      - name: Explain missing human review input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_file == '' }}
        run: |
          echo 'No blind-review file supplied. Deterministic checks ran, but human scoring of factual correctness, usefulness and calibration was not claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evaluator report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: information-quality-evaluator
          path: artifacts/information-quality/**
          if-no-files-found: ignore
          retention-days: 21

  assistant-handoff:
    name: Build assistant handoff artifact
    if: always()
    needs:
      - deterministic-quality
      - evaluator-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download all information-quality evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: information-quality-*
          path: artifacts/information-quality
          merge-multiple: true
      - name: Build consolidated assistant handoff
        if: always()
        env:
          CI_LOGS_DIR: artifacts/information-quality
          CI_STATUS: ${{ (needs.deterministic-quality.result == 'success' && needs.evaluator-contracts.result == 'success') && 'success' || 'failure' }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p artifacts/information-quality
          node scripts/diagnostics-summary.mjs
          test -s artifacts/information-quality/ASSISTANT_SUMMARY.md
          {
            echo '## Information-quality run status'
            echo '- Deterministic mode jobs: ${{ needs.deterministic-quality.result }}'
            echo '- Evaluator contracts: ${{ needs.evaluator-contracts.result }}'
            echo '- Assistant handoff: generated'
            echo ''
            echo 'Download the `information-quality-assistant-handoff` artifact and attach `ASSISTANT_SUMMARY.md` to the assistant for diagnosis.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload consolidated assistant handoff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: information-quality-assistant-handoff
          path: artifacts/information-quality/**
          if-no-files-found: warn
          retention-days: 30
