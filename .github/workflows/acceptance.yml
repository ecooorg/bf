# End-to-end user acceptance: browser journeys only. Core verification DAG runs in ci.yml.
name: End-to-End Acceptance — Browser User Journeys
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'server/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'playwright.config.*'
      - 'tests/*e2e*'
      - 'tests/*ui*'
      - 'tests/*acceptance*'
      - 'scripts/p120-e2e-preflight.mjs'
      - 'scripts/diagnostics-summary.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/acceptance.yml'
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare logs
        run: mkdir -p artifacts/acceptance
      - name: Install
        id: deps
        shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee artifacts/acceptance/01-dependencies.log
      - name: Build application
        if: success()
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee artifacts/acceptance/02-build.log
      - name: Install Playwright Chromium
        if: success()
        run: npx playwright install --with-deps chromium
      - name: Browser UI suite
        id: ui
        if: success()
        shell: bash
        run: set -o pipefail; npm run test:ui 2>&1 | tee artifacts/acceptance/03-browser-acceptance.log
      - name: Generate unified diagnostic report
        if: always()
        shell: bash
        run: |
          node scripts/diagnostics-summary.mjs
        env:
          CI_STATUS: ${{ job.status }}
          CI_LOGS_DIR: artifacts/acceptance
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-acceptance-diagnostics
          path: |
            artifacts/acceptance/ASSISTANT_SUMMARY.md
            artifacts/acceptance/*.log
          if-no-files-found: warn
          retention-days: 30
