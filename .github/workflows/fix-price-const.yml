name: fix-price-const
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-price-const.mjs
      - run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderPipeline.ts
          git commit -m "fix(immofinder): let price for provisional PLZ clear (TS2588)" || echo no-change
          git push
