name: emergency-restore-core-p13010c
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/emergency-restore-core-p13010c.mjs
      - name: commit and push
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderCore.ts package.json package-lock.json CHANGELOG.md
          git status
          git diff --cached --stat
          git commit -m "fix(immofinder): P130.10c restore core + isPortalDetailUrl category-end only" || echo "nothing to commit"
          git push
