name: Baseline Eval (dispatch only)
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Smoke (12 questions × 1 run)'
        type: boolean
        default: true
      configs:
        description: 'Configs. Default A,B (product via deploy). Add C only if non-Actions IP or EVAL ok with quota'
        type: string
        default: 'A,B'
      base_url:
        description: 'EVAL_BASE_URL'
        type: string
        default: 'https://biforge.onrender.com'
      include_c:
        description: 'Also run Gemini direct+search control (often 429 from Actions IP)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci
      - name: Run harness
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            node scripts/baseline-eval.mjs --smoke
          else
            node scripts/baseline-eval.mjs --dry-run
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EVAL_APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          EVAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_CONFIGS: ${{ inputs.configs }}
          EVAL_INCLUDE_C: ${{ inputs.include_c }}
          EVAL_GEMINI_GAP_MS: '12000'
          EVAL_KEY_COOLDOWN_MS: '60000'
          MODEL_MIN_INTERVAL_MS: '6000'
          GITHUB_SHA: ${{ github.sha }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: |
            artifacts/eval-report.json
            artifacts/eval-summary.md
          if-no-files-found: warn
