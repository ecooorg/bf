name: Emergency restore immofinder core
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore core files from e11157b3 and apply quality patches
        run: |
          set -euo pipefail
          GOOD=e11157b353c0c95bc5da3d3d657df317293a6e19
          git show $GOOD:server/immofinderCore.ts > server/immofinderCore.ts
          git show $GOOD:server/immofinderDiscovery.ts > server/immofinderDiscovery.ts
          git show $GOOD:server/immofinderFetcher.ts > server/immofinderFetcher.ts
          python3 - <<'PY'
          from pathlib import Path
          core = Path('server/immofinderCore.ts').read_text()
          # seite in LIST_URL_MORE
          a = '\\/liste(\\/|$)|gruppenhaus\\.ch|\\/_join_/i;'
          b = '\\/liste(\\/|$)|\\/seite-\\d+|\\/page\\/\\d+|gruppenhaus\\.ch|\\/_join_/i;'
          assert a in core, 'LIST_URL_MORE anchor missing'
          core = core.replace(a, b, 1)
          # parking + soft404 + pdf + wrong canton after challenge check
          needle = "if (/^(just a moment|attention required|access denied|one more step|checking your browser|please wait|cf-browser-verification)\\b/i.test(t)) return 'list_or_search_page';\n  if (WANTED.test(t)) return 'wanted_ad';"
          insert = "if (/^(just a moment|attention required|access denied|one more step|checking your browser|please wait|cf-browser-verification)\\b/i.test(t)) return 'list_or_search_page';\n  if (/\\b(inserat nicht mehr|nicht mehr verfügbar|objekt nicht (mehr )?verfügbar)\\b/i.test(t)) return 'list_or_search_page';\n  if (/\\b(tiefgarage|parkhaus|parkplatz|stellplatz|einstellplatz|garagenplatz|garage|parking)\\b/i.test(t) and not False) pass\n"
          # use proper JS in insert
          insert = """if (/^(just a moment|attention required|access denied|one more step|checking your browser|please wait|cf-browser-verification)\\b/i.test(t)) return 'list_or_search_page';
  if (/\\b(inserat nicht mehr|nicht mehr verfügbar|objekt nicht (mehr )?verfügbar)\\b/i.test(t)) return 'list_or_search_page';
  if (/\\b(tiefgarage|parkhaus|parkplatz|stellplatz|einstellplatz|garagenplatz|garage|parking)\\b/i.test(t) && !/\\b(wohnung|haus|chalet|zimmer)\\b/i.test(t)) return 'list_or_search_page';
  if (/\\.pdf(?:\\?|$)/i.test(url)) return 'list_or_search_page';
  if (WANTED.test(t)) return 'wanted_ad';"""
          assert needle in core, 'nonListing needle missing'
          core = core.replace(needle, insert, 1)
          # wrong-canton path in try block of nonListingReason
          host_needle = "if (/\\bumzug|moving\\s*company|offerten?\\s*vergleich|stündlich\\s*\\d+\\s*mietportale/i.test(t)) return 'service_or_aggregator';\n  } catch { /* ignore */ }"
          host_ins = "if (/\\bumzug|moving\\s*company|offerten?\\s*vergleich|stündlich\\s*\\d+\\s*mietportale/i.test(t)) return 'service_or_aggregator';\n    if (/\\/(zuerich|zurich|zürich|bern|basel|luzern|lucerne|genf|geneva|genève)\\b/i.test(url)) return 'list_or_search_page';\n  } catch { /* ignore */ }"
          assert host_needle in core
          core = core.replace(host_needle, host_ins, 1)
          # isPortalDetailUrl seite
          p_old = "if (parts.some((p) => /^(search|suche|suchen|results|resultate|map|karte|unterkategorie)/.test(p) || /^in-[a-z0-9-]{2,}$/.test(p))) return false;"
          p_new = "if (parts.some((p) => /^(search|suche|suchen|results|resultate|map|karte|unterkategorie)/.test(p) || /^in-[a-z0-9-]{2,}$/.test(p) || /^seite-\\d+$/.test(p) || /^page-?\\d+$/.test(p))) return false;"
          assert p_old in core
          core = core.replace(p_old, p_new, 1)
          Path('server/immofinderCore.ts').write_text(core)
          print('core patched', len(core))
          disc = Path('server/immofinderDiscovery.ts').read_text()
          d_old = """    try {
      const pathParts = new URL(h.link).pathname.split('/').filter(Boolean);
      if (pathParts.length === 0 && !snippetOnly) { decide(false, 'site_root_not_listing'); continue; }
    } catch { /* invalid URL already filtered */ }"""
          d_new = """    try {
      const u = new URL(h.link);
      const pathParts = u.pathname.split('/').filter(Boolean);
      if (pathParts.length === 0 && !snippetOnly) { decide(false, 'site_root_not_listing'); continue; }
      if (/\\.pdf$/i.test(u.pathname)) { decide(false, 'non_listing:list_or_search_page'); continue; }
    } catch { /* invalid URL already filtered */ }"""
          assert d_old in disc
          Path('server/immofinderDiscovery.ts').write_text(disc.replace(d_old, d_new, 1))
          print('discovery patched')
          fet = Path('server/immofinderFetcher.ts').read_text()
          f_old = "const directTextChars = htmlToText(direct.body).trim().length;\n    logFetch('direct_result'"
          f_new = "const directTextChars = htmlToText(direct.body).trim().length;\n    const challengeLike = /just a moment|attention required|cf-browser-verification|checking your browser|enable javascript and cookies|ddos protection by/i.test(direct.body || '');\n    logFetch('direct_result'"
          assert f_old in fet
          fet = fet.replace(f_old, f_new, 1)
          fet = fet.replace('if (!direct.ok || directTextChars < 30) {', 'if (!direct.ok || directTextChars < 30 || challengeLike) {', 1)
          Path('server/immofinderFetcher.ts').write_text(fet)
          print('fetcher patched')
          import json
          cfg = json.loads(Path('config/immofinder.json').read_text())
          for h in ['ferienhausmiete.de','adankanhaenger.ch','happyholiday.ch','traum-ferienwohnungen.ch','fewo-direkt.de','hometogo.de']:
            if h not in cfg['discovery']['skipHosts']:
              cfg['discovery']['skipHosts'].append(h)
          Path('config/immofinder.json').write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + '\n')
          print('config skipHosts ok')
          PY
      - name: Commit restore
        run: |
          git config user.name "biforge-control[bot]"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderCore.ts server/immofinderDiscovery.ts server/immofinderFetcher.ts config/immofinder.json
          git status
          git diff --cached --stat
          git commit -m "fix(immofinder): restore core from e11157b3; reject seite/list/parking/PDF/wrong-canton; Jina on challenge" || echo "nothing to commit"
          git push
