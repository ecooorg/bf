name: apply-p1308
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-p1308-immofinder.mjs
      - name: Commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderCore.ts config/immofinder.json package.json package-lock.json CHANGELOG.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "fix(immofinder): P130.8 seeker offer titles, rent cap 3500, portal detail queries"
          git push
