name: Ensure repair module
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore repair/store modules from payload
        run: node scripts/ensure-repair.mjs
      - name: Commit restored/synced files if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add server/immofinderRepair.ts server/immofinderStore.ts package-lock.json package.json \
            src/ImmoFinder.tsx server/immofinderRoutes.ts CHANGELOG.md TECHNICAL_REPORT.md \
            tests/agents-contract.test.mjs tests/immofinder-quality.test.mjs scripts/fix-agents-contract.mjs \
            server/immofinderCore.ts scripts/immofinder-p0-feed-hygiene.mjs server/immofinderCore.ts.zlib.b64.p00 server/immofinderCore.ts.zlib.b64.p01 server/immofinderCore.ts.zlib.b64.p02 server/immofinderCore.ts.zlib.b64.p03 server/immofinderCore.ts.zlib.b64.p04
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: restore repair/store modules from payload'
            git push
          fi
