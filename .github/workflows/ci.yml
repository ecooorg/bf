name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biforge
          POSTGRES_PASSWORD: biforge_test_password
          POSTGRES_DB: biforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biforge -d biforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test -f tests/core.test.mjs
      - name: Prepare log directory
        run: mkdir -p artifacts/ci-checks
      - name: Install dependencies
        id: deps
        shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee artifacts/ci-checks/ci-install.log

      # Critical probes run before migrations, typecheck, and broad positive-test volume.
      - name: P95 critical-first minimum diagnostic gate
        id: diagnostic
        if: steps.deps.outcome == 'success'
        timeout-minutes: 15
        shell: bash
        run: set -o pipefail; node scripts/run-diagnostic-gate.mjs 2>&1 | tee artifacts/ci-checks/ci-diagnostic-gate.log

      # Secondary diagnostics always run after install, even if the primary gate fails.
      - name: P93.9 secondary diagnostic gate
        id: secondary
        if: always() && steps.deps.outcome == 'success'
        timeout-minutes: 8
        shell: bash
        run: set -o pipefail; node scripts/run-secondary-diagnostic.mjs 2>&1 | tee artifacts/ci-checks/ci-secondary-diagnostic.log

      # Migrations run after install regardless of diagnostic results, to collect downstream evidence.
      - name: Apply migrations to clean PostgreSQL
        id: migrate
        if: always() && steps.deps.outcome == 'success'
        shell: bash
        run: set -o pipefail; npm run db:migrate 2>&1 | tee artifacts/ci-checks/ci-migrate.log
        env:
          DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test
          PGSSLMODE: disable

      # Run remaining checks even after failures; the runner records each result and continues. Skip suites already covered in gates.
      - name: Check (remaining independent stages)
        id: check
        if: always() && steps.deps.outcome == 'success'
        timeout-minutes: 30
        shell: bash
        run: set -o pipefail; node scripts/run-independent-checks.mjs 2>&1 | tee artifacts/ci-checks/ci-check.log
        env:
          CHECK_SKIP_SCRIPTS: typecheck,test:core,test:models,test:files,test:app-builder,test:project,test:regression,test:pipeline

      - name: Live PostgreSQL contract tests
        id: live
        if: always() && steps.deps.outcome == 'success'
        timeout-minutes: 10
        shell: bash
        run: set -o pipefail; npm run test:database:live 2>&1 | tee artifacts/ci-checks/ci-live.log
        env:
          DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test
          PGSSLMODE: disable
      - name: Project Mode API security tests
        id: api
        if: always() && steps.deps.outcome == 'success'
        timeout-minutes: 10
        shell: bash
        run: set -o pipefail; npm run test:bx06:api 2>&1 | tee artifacts/ci-checks/ci-api.log
        env:
          DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test
          PGSSLMODE: disable
      - name: Build application
        id: build
        if: always() && steps.deps.outcome == 'success'
        timeout-minutes: 8
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee artifacts/ci-checks/ci-build.log

      - name: Scan repository for leaked secrets
        if: always() && steps.deps.outcome == 'success'
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate NEXT_PATCH.md
        if: always()
        shell: bash
        run: node scripts/patch-quality-report.mjs
        env:
          CI_STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          SECONDARY_OUTCOME: ${{ steps.secondary.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          API_OUTCOME: ${{ steps.api.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}

      - name: ASSISTANT HANDOFF — GitHub Actions summary
        if: always()
        run: node scripts/ci-summary.mjs
        env:
          CI_STATUS: ${{ job.status }}

      - name: Package compact CI artifact
        if: always()
        run: node scripts/package-ci-artifacts.mjs

      - name: Upload compact CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biforge-ci-report
          path: artifacts/ci-checks/
          if-no-files-found: error
          retention-days: 7
