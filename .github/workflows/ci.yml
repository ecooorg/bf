name: ci
on: [push, pull_request]

permissions:
contents: read

jobs:
check-and-build:
runs-on: ubuntu-latest
timeout-minutes: 45

services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_USER: biforge
      POSTGRES_PASSWORD: biforge_test_password
      POSTGRES_DB: biforge_test
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U biforge -d biforge_test"
      --health-interval 5s
      --health-timeout 5s
      --health-retries 20

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version-file: .nvmrc
      cache: npm
