name: Emergency fix list-url filters
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore and patch
        run: node scripts/emergency-list-url-fix.mjs
      - name: Commit and push (no workflow files — GITHUB_TOKEN lacks workflows scope)
        run: |
          set -euo pipefail
          git config user.name "ecooorg"
          git config user.email "ecooorg@gmail.com"
          git add server/immofinderCore.ts server/immofinderDiscovery.ts server/immofinderFetcher.ts server/immofinderPipeline.ts config/immofinder.json tests/immofinder-quality.test.mjs package.json package-lock.json CHANGELOG.md
          git status
          git commit -m "fix(immofinder): P130.6 reject rooms=0/empty SERP; parse pièces; tighten unavailable" || echo "no changes"
          git push origin HEAD:main
