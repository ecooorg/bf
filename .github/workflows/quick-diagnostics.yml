name: BiForge Quick Diagnostics

on:
  workflow_dispatch:
    inputs:
      include_browser:
        description: 'Run the isolated Architectural Test Lab browser smoke test'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quick-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Prepare the single report destination
        shell: bash
        run: mkdir -p artifacts/quick-diagnostics "$RUNNER_TEMP"

      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --prefer-offline --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/quick-npm-ci.log"

      - name: Cache Playwright Chromium
        if: inputs.include_browser && steps.dependencies.outcome == 'success'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: quick-diagnostics-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium when needed
        if: inputs.include_browser && steps.dependencies.outcome == 'success' && steps.browser-cache.outputs.cache-hit != 'true'
        id: browser-install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/quick-browser-install.log"

      - name: Ensure cached Chromium is usable
        if: inputs.include_browser && steps.dependencies.outcome == 'success' && steps.browser-cache.outputs.cache-hit == 'true'
        id: browser-install-cached
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee "$RUNNER_TEMP/quick-browser-install.log"

      - name: Run focused diagnostics and compose one error report
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INCLUDE_BROWSER: ${{ inputs.include_browser }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          BROWSER_INSTALL_OUTCOME: ${{ (steps.browser-install.outcome == 'success' || steps.browser-install-cached.outcome == 'success') && 'success' || (steps.browser-install.outcome == 'failure' || steps.browser-install-cached.outcome == 'failure') && 'failure' || 'success' }}
          DEPENDENCY_LOG: ${{ runner.temp }}/quick-npm-ci.log
          BROWSER_INSTALL_LOG: ${{ runner.temp }}/quick-browser-install.log
          QUICK_DIAGNOSTICS_OUTPUT: artifacts/quick-diagnostics/ERROR_SUMMARY.txt
        run: node scripts/quick-diagnostics.mjs

      - name: Upload the single compact error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biforge-quick-diagnostics
          path: artifacts/quick-diagnostics/ERROR_SUMMARY.txt
          if-no-files-found: error
          retention-days: 14
