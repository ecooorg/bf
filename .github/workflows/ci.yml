name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biforge
          POSTGRES_PASSWORD: biforge_test_password
          POSTGRES_DB: biforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biforge -d biforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test -f tests/contracts.test.mjs
      - run: npm ci
      - name: Apply migrations to clean PostgreSQL
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test
          PGSSLMODE: disable
      - run: npm run check
      - name: Live PostgreSQL contract tests
        run: npm run test:database:live
        env:
          DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test
          PGSSLMODE: disable
      - name: Project Mode API security tests
        run: npm run test:bx06:api
        env:
          DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test
          PGSSLMODE: disable
      - run: npm run build
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
