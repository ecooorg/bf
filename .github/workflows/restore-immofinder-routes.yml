name: restore-immofinder-routes
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/immofinder/_restore_parts/**'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct routes from base64 parts
        run: |
          set -euo pipefail
          if [ ! -d server/immofinder/_restore_parts ]; then
            echo "no parts"; exit 1
          fi
          cat server/immofinder/_restore_parts/part-*.b64 | tr -d '\n' | base64 -d > server/immofinderRoutes.ts
          wc -c server/immofinderRoutes.ts
          head -c 60 server/immofinderRoutes.ts; echo
          grep -q "registerImmoFinderRoutes" server/immofinderRoutes.ts
          grep -q "isImmoCronCall" server/immofinderRoutes.ts
          git config user.name "immofinder-restore"
          git config user.email "bot@users.noreply.github.com"
          git add server/immofinderRoutes.ts
          git commit -m "fix(immofinder): reconstruct routes from restore parts"
          git push origin HEAD:main
