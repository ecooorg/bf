name: Baseline Eval (dispatch only)
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Smoke (12 questions × 1 run)'
        type: boolean
        default: true
      set:
        description: 'Question set'
        type: choice
        options: [dev, dev+holdout]
        default: dev
      configs:
        description: 'Configs (comma)'
        type: string
        default: 'A,B,C,N'
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci
      - name: Dry-run harness
        run: node scripts/baseline-eval.mjs --dry-run
        env:
          # Secrets available if owner configures them; never echoed
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: |
            artifacts/eval-report.json
            artifacts/eval-summary.md
          if-no-files-found: warn
