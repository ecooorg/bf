name: P119 ui-smoke live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p119-ui-smoke-live
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify deployed commit and agent smoke
        env:
          STAGING_SERVICE_URL: ${{ secrets.STAGING_SERVICE_URL }}
          STAGING_APP_PASSWORD: ${{ secrets.STAGING_APP_PASSWORD }}
          P119_SMOKE_KIND: ui
        run: node scripts/p119-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p119-ui-smoke-evidence
          path: p119-live/
          if-no-files-found: warn
          retention-days: 14
