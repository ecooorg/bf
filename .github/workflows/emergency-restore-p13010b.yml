name: emergency-restore-p13010b
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore three files from good commit and patch
        run: |
          set -euo pipefail
          GOOD=ea789e3e17b2e72abd541702f34c46c9c8b17003
          git show "$GOOD:server/immofinderRepair.ts" > server/immofinderRepair.ts
          git show "$GOOD:server/immofinderPipeline.ts" > server/immofinderPipeline.ts
          git show "$GOOD:tests/immofinder-p0.test.mjs" > tests/immofinder-p0.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          # version
          p = Path('server/immofinderRepair.ts')
          t = p.read_text()
          t = t.replace("export const REPAIR_RULES_VERSION = '130.10a.5';", "export const REPAIR_RULES_VERSION = '130.10b.5';", 1)
          p.write_text(t)
          # pipeline rooms gate for provisional snippets
          p = Path('server/immofinderPipeline.ts')
          t = p.read_text()
          t = t.replace(
            "      if (!ex.rooms || !(ex.rooms.rooms > 0)) { await deny('rooms_unknown'); continue; }\n      if (ex.rooms.rooms < cfg.minRooms) { await deny('rooms_below_min', String(ex.rooms.rooms)); continue; }\n      // Group houses / hostels mis-parsed as 15–68 rooms — never a private 3.5-room flat\n      if (ex.rooms.rooms >= 12) { await deny('rooms_too_many', String(ex.rooms.rooms)); continue; }",
            "      if (!snippetEvidence && (!ex.rooms || !(ex.rooms.rooms > 0))) { await deny('rooms_unknown'); continue; }\n      if (ex.rooms && ex.rooms.rooms > 0 && ex.rooms.rooms < cfg.minRooms) { await deny('rooms_below_min', String(ex.rooms.rooms)); continue; }\n      // Group houses / hostels mis-parsed as 15–68 rooms — never a private 3.5-room flat\n      if (ex.rooms && ex.rooms.rooms >= 12) { await deny('rooms_too_many', String(ex.rooms.rooms)); continue; }",
            1,
          )
          t = t.replace('rooms_text: ex.rooms.quote, rooms_estimated: ex.rooms.rooms, rooms_basis: ex.rooms.basis,', 'rooms_text: ex.rooms?.quote || \'\', rooms_estimated: ex.rooms?.rooms ?? 0, rooms_basis: ex.rooms?.basis || \'\',')
          t = t.replace('rooms: ex.rooms.rooms }),', 'rooms: ex.rooms?.rooms ?? null }),')
          t = t.replace('roomsEstimated: ex.rooms.rooms,', 'roomsEstimated: ex.rooms?.rooms ?? null,')
          p.write_text(t)
          # p0 version assert
          p = Path('tests/immofinder-p0.test.mjs')
          t = p.read_text()
          t = t.replace(
            "  assert.equal(REPAIR_RULES_VERSION, '130.10a.5');",
            "  assert.equal(REPAIR_RULES_VERSION, `${JSON.parse(readFileSync(new URL('../package.json', import.meta.url), 'utf8')).patch}.5`);",
            1,
          )
          p.write_text(t)
          print('patched ok')
          PY
          grep -n "REPAIR_RULES_VERSION = " server/immofinderRepair.ts
          grep -n "snippetEvidence && (!ex.rooms" server/immofinderPipeline.ts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/immofinderRepair.ts server/immofinderPipeline.ts tests/immofinder-p0.test.mjs
          git commit -m "fix(ci): restore immofinder from ea789e3e + REPAIR 130.10b.5 + provisional snippet rooms"
          git push origin HEAD:main
