name: ci
on: [push, pull_request]
permissions:
  contents: read
  actions: read
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biforge
          POSTGRES_PASSWORD: biforge_test_password
          POSTGRES_DB: biforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biforge -d biforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test -f tests/core.test.mjs
      - name: Prepare log directory
        run: mkdir -p artifacts/ci-checks
      - name: Install dependencies
        id: deps
        shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee artifacts/ci-checks/ci-install.log

      # One verification DAG (docs/verification-manifest.json, profile ci): critical probes, minimum suites, remaining checks,
      # migrations, live PostgreSQL and API tests, build. Independent checks finish after an unrelated failure; dependants are BLOCKED with the prerequisite named.
      - name: Verification DAG
        id: dag
        if: steps.deps.outcome == 'success'
        timeout-minutes: 60
        shell: bash
        run: set -o pipefail; node scripts/run-dag.mjs --profile ci 2>&1 | tee artifacts/ci-checks/ci-dag.log
        env:
          DAG_ALLOW_UNSAFE: 'true'
          DAG_TEST_DATABASE_URL: postgres://biforge:biforge_test_password@localhost:5432/biforge_test

      - name: Scan repository for leaked secrets
        if: always() && steps.deps.outcome == 'success'
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture CI metrics and recent run history
        if: always()
        shell: bash
        run: node scripts/ci-run-history.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Generate NEXT_PATCH.md
        if: always()
        shell: bash
        run: node scripts/patch-quality-report.mjs
        env:
          CI_STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DAG_OUTCOME: ${{ steps.dag.outcome }}

      - name: Evidence gate (fail closed)
        if: always()
        shell: bash
        run: node scripts/ci-evidence-gate.mjs

      - name: Package complete CI diagnostics
        if: always()
        run: node scripts/package-ci-artifacts.mjs
        env:
          CI_STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: ASSISTANT HANDOFF — GitHub Actions summary
        if: always()
        run: node scripts/ci-summary.mjs
        env:
          CI_STATUS: ${{ job.status }}

      - name: Print final assistant handoff
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/ci-checks/BIForge-NEXT-PATCH.md ]; then
            cat artifacts/ci-checks/BIForge-NEXT-PATCH.md
          elif [ -f artifacts/ci-checks/NEXT_PATCH.md ]; then
            cat artifacts/ci-checks/NEXT_PATCH.md
          else
            echo 'BIForge-NEXT-PATCH.md unavailable; inspect CI report-generation errors above.'
          fi

      - name: Upload complete CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biforge-ci-report
          path: |
            artifacts/ci-checks/BIForge-NEXT-PATCH.md
            artifacts/ci-checks/biforge-ci-logs.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
