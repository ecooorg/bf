# UI viewport check (QA-02). Not part of npm run check.
# Playwright --with-deps runs apt and can take 20+ minutes on a cold runner;
# cache browsers and skip apt when the cache hits.
name: ui-check
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      # Cold cache: download browser + OS deps (slow apt once per key).
      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Warm cache: browser bits restored; do not re-run apt.
      - name: Ensure Playwright Chromium binary
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: UI viewport checks
        run: npm run test:ui
