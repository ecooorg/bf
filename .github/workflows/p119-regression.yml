name: P119 Architect ZIP regression

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: Delete projects created by the regression
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: p119-architect-regression
  cancel-in-progress: false

jobs:
  architect-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - name: Verify deployed commit before regression
        env:
          STAGING_SERVICE_URL: ${{ secrets.STAGING_SERVICE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/p119-regression-preflight.mjs
      - name: Build, validate and download Architect ZIP
        env:
          STAGING_SERVICE_URL: ${{ secrets.STAGING_SERVICE_URL }}
          STAGING_APP_PASSWORD: ${{ secrets.STAGING_APP_PASSWORD }}
          P118_CLEANUP: ${{ inputs.cleanup }}
          P118_OUT_DIR: p119-regression
        run: node scripts/p118-architect-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p119-architect-regression-evidence
          path: p119-regression/
          if-no-files-found: warn
          retention-days: 14
