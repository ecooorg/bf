# Manual-only: phrase / heuristic / routing regression suite (not product-core CI).
# Run when debugging search-routing phrasing or after intentional heuristic changes.
# Core CI and Answer Quality must NOT depend on these checks (owner decision P125.13).
# The suite command is `npm run test:search-heuristics`, so this file never lists stale test paths.
name: Search Heuristics — Manual Phrase and Routing Suite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-heuristics-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  MODEL_MIN_INTERVAL_MS: '0'
  CI_LOGS_DIR: artifacts/search-heuristics

jobs:
  heuristics:
    name: Phrase and routing heuristics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          mkdir -p "$CI_LOGS_DIR"
          npm ci --ignore-scripts 2>&1 | tee "$CI_LOGS_DIR/01-install.log"
      - name: Preflight (current files, scripts, exports, version)
        run: node scripts/workflow-preflight.mjs
      - name: Search heuristics suite
        run: |
          set -o pipefail
          npm run test:search-heuristics 2>&1 | tee "$CI_LOGS_DIR/02-search-heuristics.log"
      - name: Assistant diagnostic report
        if: always()
        shell: bash
        run: |
          if ! node scripts/diagnostics-summary.mjs; then echo "Report generation failed; raw logs are still uploaded."; fi
          if [ -f "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" ]; then cat "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
        env:
          CI_STATUS: ${{ job.status }}
          WORKFLOW_RERUN: 'npm run test:search-heuristics'
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Upload assistant report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-heuristics-diagnostics
          path: |
            artifacts/search-heuristics/ASSISTANT_SUMMARY.md
            artifacts/search-heuristics/*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
