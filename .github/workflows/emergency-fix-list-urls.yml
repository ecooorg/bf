name: Emergency fix list-url filters
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore and patch
        run: node scripts/emergency-list-url-fix.mjs
      - name: Commit and push (no workflow files — GITHUB_TOKEN lacks workflows scope)
        run: |
          set -euo pipefail
          git config user.name "ecooorg"
          git config user.email "ecooorg@gmail.com"
          git add server/immofinderCore.ts server/immofinderDiscovery.ts server/immofinderFetcher.ts config/immofinder.json
          git status
          git commit -m "fix(immofinder): restore core; reject seite/parking/PDF/wrong-canton; Jina on challenge" || echo "no changes"
          git push origin HEAD:main
