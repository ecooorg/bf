name: Apply immofinder rooms fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply surgical patch
        run: node scripts/patch-immofinder-rooms.mjs
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ecooorg"
          git config user.email "ecooorg@gmail.com"
          git add server/immofinderCore.ts tests/immofinder-quality.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(immofinder): correct half-room parseRooms and reject challenge titles"
          git push origin HEAD:main
