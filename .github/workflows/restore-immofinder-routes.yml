name: restore-immofinder-routes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/trigger-restore-routes'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and commit restored routes
        run: |
          set -euo pipefail
          URL='https://tmpfiles.org/dl/1795735794.4a291de9ed09f58e/wRAzvWTOzIDJ/routes.final.ts'
          curl -sSL --max-time 60 -o server/immofinderRoutes.ts "$URL"
          wc -c server/immofinderRoutes.ts
          head -c 80 server/immofinderRoutes.ts; echo
          grep -q 'registerImmoFinderRoutes' server/immofinderRoutes.ts
          grep -q 'isImmoCronCall' server/immofinderRoutes.ts
          grep -q "path === '/settings'" server/immofinderRoutes.ts
          git config user.name 'immofinder-restore'
          git config user.email 'bot@users.noreply.github.com'
          git add server/immofinderRoutes.ts
          git commit -m 'fix(immofinder): restore routes + secret PUT /settings'
          git push origin HEAD:main
