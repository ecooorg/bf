# P127.18/23 — Project Mode user-value evaluation. Zero input required.
# offline-human-sim: rubric SELF-TEST on fixed fixtures (not evidence about the live product).
# live-project-mode: real builds on https://biforge.onrender.com, real Chromium, 10 neutral prompts x 2 runs.
#   P127.26a: manual start only (workflow_dispatch, no inputs); no automatic trigger after patches.
#   Waits by itself until the deployed commit equals the commit under test; reports PRODUCT results and INFRA failures separately.
name: Project Mode — User Value (Human Simulator)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-user-value-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  offline-human-sim:
    name: Offline human-simulator suite
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_LOGS_DIR: artifacts/project-user-value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          mkdir -p "$CI_LOGS_DIR"
          npm ci --ignore-scripts 2>&1 | tee "$CI_LOGS_DIR/01-install.log"
      - name: Human-simulator offline eval
        run: |
          set -o pipefail
          npm run test:project-user-value 2>&1 | tee "$CI_LOGS_DIR/02-human-sim.log"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-user-value-report
          path: |
            artifacts/project-user-value-report.json
            artifacts/project-user-value-report.md
            artifacts/project-user-value/**
          if-no-files-found: warn

  live-project-mode:
    name: Live Project Mode (deployed instance)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    env:
      EVAL_BASE_URL: https://biforge.onrender.com
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      UV_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      UV_REPEATS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Decide whether Project Mode changed since the last live measurement
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The newest uploaded live report belongs to the last measured commit (artifacts exist only for real live runs).
          LAST=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=project-user-value-live&per_page=1" --jq '.artifacts[0].workflow_run.head_sha // empty' || true)
          if [ -z "$LAST" ] || ! git cat-file -e "$LAST^{commit}" 2>/dev/null; then
            echo "No earlier live measurement found; running." >> "$GITHUB_STEP_SUMMARY"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$LAST" HEAD | grep -E '^(appBuilder/|server/(appBuilder|project)|src/Project|config/project-user-value|scripts/project-user-value-live)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No Project Mode changes since the last live measurement (${LAST:0:7}); live run skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Live run (waits for the deploy, then measures)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/project-user-value-live.mjs
      - name: Upload live report, screenshots and packages
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-user-value-live
          path: artifacts/project-user-value-live/**
          if-no-files-found: warn
