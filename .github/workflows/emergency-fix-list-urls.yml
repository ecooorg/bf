name: Emergency fix list-url filters
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply CI-green fixes
        run: |
          set -euo pipefail
          # package-lock top-level patch
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('package-lock.json')
          d = json.loads(p.read_text())
          d['patch'] = '130.6'
          d.setdefault('packages', {}).setdefault('', {})['patch'] = '130.6'
          p.write_text(json.dumps(d, indent=2) + '\n')
          print('lock.patch', d['patch'])
          PY
          # remove overly strict portal detail rule
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/immofinderCore.ts')
          t = p.read_text()
          old = "  if (parts.length <= 4 && !parts.some((p) => /\\d{4,}/.test(p))) return false;\n"
          if old not in t:
            raise SystemExit('strict portal rule missing')
          p.write_text(t.replace(old, '', 1))
          print('portal rule loosened')
          PY
          # repair stamp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/immofinderRepair.ts')
          t = p.read_text()
          t2 = t.replace("REPAIR_RULES_VERSION = '130.5a.5'", "REPAIR_RULES_VERSION = '130.6.5'")
          if t2 == t:
            raise SystemExit('repair stamp missing')
          p.write_text(t2)
          print('repair stamp 130.6.5')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "ecooorg"
          git config user.email "ecooorg@gmail.com"
          git add package-lock.json server/immofinderCore.ts server/immofinderRepair.ts
          git commit -m "fix(immofinder): CI green — lock.patch 130.6, portal detail, repair stamp" || echo no changes
          git push origin HEAD:main
