# Advanced CodeQL — resilient to transient GitHub bundle CDN failures (HTTP 504).
# If the repository still uses "Default setup" under Settings → Code security,
# switch to Advanced setup so this workflow is the sole CodeQL job.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly; avoids competing with every push when the bundle CDN is flaky
    - cron: '25 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Bundle download outages (504) must not block the product pipeline.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
        # init is where the bundle is downloaded; tolerate CDN 5xx
        continue-on-error: true
        id: codeql-init

      - name: Perform CodeQL Analysis
        if: steps.codeql-init.outcome == 'success'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
        continue-on-error: true
