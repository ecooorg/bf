# P126.14 — Answer-quality verification (C126). Offline suite is the product kernel for search,
# carousel, fidelity, source policy and direct-conversation fallback. Phrase/heuristic packs are
# manual-only (search-heuristics.yml, owner decision P125.13). Action pins match Core CI.
name: Answer Quality — Routing, Search, Carousel and Replay

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run live Gemini/search smoke (requires repository secrets)'
        type: boolean
        default: false
      weather_place:
        description: 'Optional place for live weather smoke'
        type: string
        default: ''
  pull_request:
    paths:
      - 'server/**'
      - 'server.ts'
      - 'config/**'
      - 'connectors.yaml'
      - 'tests/*.test.mjs'
      - 'scripts/carousel-*.mjs'
      - 'scripts/workflow-preflight.mjs'
      - 'scripts/diagnostics-summary.mjs'
      - 'package.json'
      - '.github/workflows/answer-quality-verify.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: answer-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  MODEL_MIN_INTERVAL_MS: '0'

jobs:
  offline-suite:
    name: Offline answer-quality + carousel deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_LOGS_DIR: artifacts/answer-quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          mkdir -p "$CI_LOGS_DIR"
          npm ci --ignore-scripts 2>&1 | tee "$CI_LOGS_DIR/01-install.log"
      - name: Preflight (current files, scripts, exports, version)
        run: node scripts/workflow-preflight.mjs
      - name: Offline answer-quality suite
        run: |
          set -o pipefail
          npm run test:answer-quality 2>&1 | tee "$CI_LOGS_DIR/02-answer-quality.log"
      - name: Deterministic carousel verification
        run: |
          set -o pipefail
          node scripts/carousel-verify.mjs 2>&1 | tee "$CI_LOGS_DIR/03-carousel-verify.log" || { echo "Deterministic carousel verification failed"; exit 1; }
      - name: Render runtime contract probe (needs repository variable CAROUSEL_RENDER_URL)
        env:
          CAROUSEL_RENDER_URL: ${{ vars.CAROUSEL_RENDER_URL }}
        run: |
          set -o pipefail
          if [ -z "$CAROUSEL_RENDER_URL" ]; then
            echo "NOT_RUN render runtime probe: repository variable CAROUSEL_RENDER_URL (deployed HTTPS URL) is not set; offline contract is covered by tests/providers-models.test.mjs" | tee "$CI_LOGS_DIR/04-carousel-render-probe.log"
            exit 0
          fi
          node scripts/carousel-render-probe.mjs 2>&1 | tee "$CI_LOGS_DIR/04-carousel-render-probe.log" || { echo "Render runtime contract probe failed"; exit 1; }
      - name: National authorities data loads
        run: |
          set -o pipefail
          node --import tsx -e "import { loadNationalAuthorities } from './server/nationalAuthorities.ts'; const a=loadNationalAuthorities(); if(a.length<5) { console.error('FAIL authorities', a.length); process.exit(1); } console.log('PASS authorities', a.length);" 2>&1 | tee "$CI_LOGS_DIR/05-national-authorities.log"
      - name: Copy structured carousel reports
        if: always()
        run: |
          mkdir -p "$CI_LOGS_DIR/structured"
          if ls artifacts/carousel-verify/*.json >/dev/null 2>&1; then
            cp artifacts/carousel-verify/*.json "$CI_LOGS_DIR/structured/"
          else
            printf 'NOT_RUN no structured carousel reports were produced\n' > "$CI_LOGS_DIR/06-structured.log"
          fi
      - name: Assistant diagnostic report
        if: always()
        shell: bash
        run: |
          if ! node scripts/diagnostics-summary.mjs; then echo "Report generation failed; raw logs are still uploaded."; fi
          if [ -f "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" ]; then cat "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
        env:
          CI_STATUS: ${{ job.status }}
          WORKFLOW_RERUN: 'npm run test:answer-quality && node scripts/carousel-verify.mjs && node scripts/carousel-render-probe.mjs'
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Upload assistant report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: answer-quality-diagnostics-offline
          path: |
            artifacts/answer-quality/ASSISTANT_SUMMARY.md
            artifacts/answer-quality/*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  live-smoke:
    name: Live carousel + search smoke (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: offline-suite
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live == true }}
    env:
      CI_LOGS_DIR: artifacts/answer-quality-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          mkdir -p "$CI_LOGS_DIR"
          npm ci --ignore-scripts 2>&1 | tee "$CI_LOGS_DIR/01-install.log"
      - name: Live carousel smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAROUSEL_LIVE: 'true'
          WEATHER_PLACE: ${{ inputs.weather_place }}
        run: |
          set -o pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "NOT_RUN live smoke: GEMINI_API_KEY secret is not set" | tee "$CI_LOGS_DIR/02-live-smoke.log"
            exit 0
          fi
          node --import tsx scripts/carousel-live-smoke.mjs 2>&1 | tee "$CI_LOGS_DIR/02-live-smoke.log"
          echo "Production multi-turn remains NOT_RUN here; Navigator observes it after deploy (patch must match package.json)." | tee -a "$CI_LOGS_DIR/02-live-smoke.log"
      - name: Assistant diagnostic report
        if: always()
        shell: bash
        run: |
          if ! node scripts/diagnostics-summary.mjs; then echo "Report generation failed; raw logs are still uploaded."; fi
          if [ -f "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" ]; then cat "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
        env:
          CI_STATUS: ${{ job.status }}
          WORKFLOW_RERUN: 'GEMINI_API_KEY=... node --import tsx scripts/carousel-live-smoke.mjs'
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Upload assistant report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: answer-quality-diagnostics-live
          path: |
            artifacts/answer-quality-live/ASSISTANT_SUMMARY.md
            artifacts/answer-quality-live/*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
