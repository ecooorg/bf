# C123 P123.3 — runtime model sources catalog (public metadata only; secrets in env).
# schema_version 1 — loaders reject unknown majors.
schema_version: 1
sources:
  - id: gemini-free-pool
    channel: api
    provider: gemini
    adapter: gemini
    enabled: true
    priority: 100
    data_classes: [public, restricted]
    models:
      - id: gemini-3.5-flash-lite
        role: strong
      - id: gemini-3.1-flash-lite
        role: light
    key_pool:
      env_names: [GEMINI_API_KEY, GEMINI_API_KEY_1, GEMINI_API_KEY_2, GEMINI_API_KEY_3, GEMINI_API_KEY_4, GEMINI_API_KEY_5, GEMINI_API_KEY_6, GEMINI_API_KEY_7, GEMINI_API_KEY_8, GEMINI_API_KEY_9, GEMINI_API_KEY_10, GEMINI_API_KEY_11, GEMINI_API_KEY_12, GEMINI_API_KEY_13]
      max_slots: 13
    notes: Primary free-key pool (org allowlist). Live in BiForge.

  - id: openrouter-free
    channel: api
    provider: openrouter
    adapter: openai-compatible
    enabled: false
    priority: 80
    data_classes: [public]
    base_url: https://openrouter.ai/api/v1
    models:
      - id: openrouter/free
        role: light
    key_pool:
      env_names: [OPENROUTER_API_KEY]
      max_slots: 13
    notes: Candidate. :free models ~20 RPM / 50 RPD (1000 after $10 lifetime credits). Lineup rotates.

  - id: groq-free
    channel: api
    provider: groq
    adapter: openai-compatible
    enabled: false
    priority: 75
    data_classes: [public]
    base_url: https://api.groq.com/openai/v1
    models:
      - id: openai/gpt-oss-120b
        role: strong
      - id: openai/gpt-oss-20b
        role: light
    key_pool:
      env_names: [GROQ_API_KEY]
      max_slots: 13
    notes: Candidate. Fast LPU; ~30 RPM / 1k RPD / 200k tokens/day per model (org-level limits).

  - id: cloudflare-workers-ai
    channel: api
    provider: cloudflare-workers-ai
    adapter: openai-compatible
    enabled: false
    priority: 60
    data_classes: [public]
    models:
      - id: "@cf/meta/llama-3.1-8b-instruct"
        role: light
    key_pool:
      env_names: [CLOUDFLARE_API_TOKEN]
      max_slots: 13
    notes: Candidate. 10k Neurons/day. Needs CLOUDFLARE_ACCOUNT_ID for base URL.

  - id: mistral-free
    channel: api
    provider: mistral
    adapter: openai-compatible
    enabled: false
    priority: 55
    data_classes: [public]
    base_url: https://api.mistral.ai/v1
    models:
      - id: mistral-small-latest
        role: light
    key_pool:
      env_names: [MISTRAL_API_KEY]
      max_slots: 13
    notes: Candidate. Free-mode credits; opt-out of training recommended.

  - id: nvidia-nim
    channel: api
    provider: nvidia
    adapter: openai-compatible
    enabled: false
    priority: 50
    data_classes: [public]
    base_url: https://integrate.api.nvidia.com/v1
    models:
      - id: nvidia/nemotron-3-super-120b-a12b
        role: strong
    key_pool:
      env_names: [NVIDIA_API_KEY]
      max_slots: 13
    notes: Candidate. Wide catalog; prototype terms; not production license.

  - id: sambanova-free
    channel: api
    provider: sambanova
    adapter: openai-compatible
    enabled: false
    priority: 45
    data_classes: [public]
    base_url: https://api.sambanova.ai/v1
    models:
      - id: Meta-Llama-3.3-70B-Instruct
        role: strong
    key_pool:
      env_names: [SAMBANOVA_API_KEY]
      max_slots: 13
    notes: Candidate. Low daily free caps reported (~20 RPD class).

  - id: cohere-trial
    channel: api
    provider: cohere
    adapter: openai-compatible
    enabled: false
    priority: 40
    data_classes: [public]
    models:
      - id: command-r-plus
        role: strong
    key_pool:
      env_names: [COHERE_API_KEY]
      max_slots: 13
    notes: Candidate. Trial key; often non-commercial / low monthly calls.
