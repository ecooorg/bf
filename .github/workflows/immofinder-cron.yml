name: ImmoFinder scheduled run
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hourly tick (the server decides from the saved settings whether a search is due)
        env:
          IMMOFINDER_BASE_URL: ${{ secrets.IMMOFINDER_BASE_URL }}
          IMMOFINDER_RUN_SECRET: ${{ secrets.IMMOFINDER_RUN_SECRET }}
        run: |
          set -e
          if [ -z "$IMMOFINDER_BASE_URL" ] || [ -z "$IMMOFINDER_RUN_SECRET" ]; then
            echo "IMMOFINDER_BASE_URL / IMMOFINDER_RUN_SECRET not configured; skipping."
            exit 0
          fi
          BASE="${IMMOFINDER_BASE_URL%/}"
          echo "POST $BASE/api/immofinder/run (schedule tick)"
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$BASE/api/immofinder/run" \
            -H "X-Immofinder-Secret: $IMMOFINDER_RUN_SECRET" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP $code"
          cat /tmp/out.json; echo
          # 202 started, 200 skipped (not due / manual), 409 already running
          if [ "$code" = "202" ] || [ "$code" = "200" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          echo "Unexpected status (check secret, BASE_URL, and app logs for immofinder_run_* )"
          exit 1
