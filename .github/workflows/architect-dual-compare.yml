# Architect Lab vs Legacy — same goal, automated compare report for the navigator.
name: Architect dual compare

on:
  workflow_dispatch:
    inputs:
      goal:
        description: Optional goal text (empty = Expense Tracker fixture)
        required: false
        default: ''
        type: string
      cleanup:
        description: Delete temporary projects after the run
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: architect-dual-compare
  cancel-in-progress: false

jobs:
  dual-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Preflight secrets
        run: |
          if [ -z "${{ secrets.STAGING_SERVICE_URL }}" ]; then echo "STAGING_SERVICE_URL secret missing" >&2; exit 1; fi
          if [ -z "${{ secrets.STAGING_APP_PASSWORD }}" ]; then echo "STAGING_APP_PASSWORD secret missing" >&2; exit 1; fi
      - name: Run dual compare (Lab path + Legacy path)
        env:
          STAGING_SERVICE_URL: ${{ secrets.STAGING_SERVICE_URL }}
          STAGING_APP_PASSWORD: ${{ secrets.STAGING_APP_PASSWORD }}
          DUAL_GOAL: ${{ inputs.goal }}
          DUAL_CLEANUP: ${{ inputs.cleanup }}
          DUAL_OUT_DIR: architect-dual-compare
          DUAL_BUILD_WAIT_MS: '600000'
        run: node scripts/architect-dual-compare.mjs
      - name: Upload compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-dual-compare-report
          path: |
            architect-dual-compare/report.md
            architect-dual-compare/report.json
          if-no-files-found: warn
