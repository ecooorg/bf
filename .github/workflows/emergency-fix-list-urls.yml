name: Emergency fix list-url filters
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply test + portal index fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # leanCfg: force maxCandidatesPerQuery=4 for stable p0 coverage tests
          p = Path('tests/immofinder-p0.test.mjs')
          t = p.read_text()
          t = t.replace("assert.equal(REPAIR_RULES_VERSION, '130.5a.5');", "assert.equal(REPAIR_RULES_VERSION, '130.6.5');")
          old = "discovery: { ...cfg.discovery, communesPerRun: 1, queries: ['A {commune}'], portalQueries: [], maxPagesPerRun: 10, serperMinIntervalMs: 0, ...over },"
          neu = "discovery: { ...cfg.discovery, communesPerRun: 1, queries: ['A {commune}'], portalQueries: [], maxPagesPerRun: 10, serperMinIntervalMs: 0, maxCandidatesPerQuery: 4, ...over },"
          if old not in t:
            raise SystemExit('leanCfg discovery line missing')
          t = t.replace(old, neu, 1)
          p.write_text(t)
          print('p0 tests patched')

          # portal index without numeric id (immobilier …/grisons/landquart) but allow long slug details
          core = Path('server/immofinderCore.ts')
          c = core.read_text()
          needle = "  if (parts.some((p) => /^(search|suche|suchen|results|resultate|map|karte|unterkategorie)/.test(p) || /^in-[a-z0-9-]{2,}$/.test(p) || /^seite-\\d+$/.test(p) || /^page-?\\d+$/.test(p))) return false;\n  return true;"
          insert = "  if (parts.some((p) => /^(search|suche|suchen|results|resultate|map|karte|unterkategorie)/.test(p) || /^in-[a-z0-9-]{2,}$/.test(p) || /^seite-\\d+$/.test(p) || /^page-?\\d+$/.test(p))) return false;\n  // Category+region+commune index (immobilier …/appartement-maison/grisons/landquart) has no listing id.\n  if (parts.length <= 4 && /^(appartement-maison|wohnung-haus|appartement|maison|wohnung)$/i.test(parts[0] || '') && !parts.some((p) => /\\d{5,}/.test(p))) return false;\n  return true;"
          if needle not in c:
            raise SystemExit('isPortalDetailUrl tail missing')
          core.write_text(c.replace(needle, insert, 1))
          print('core portal index rule ok')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "ecooorg"
          git config user.email "ecooorg@gmail.com"
          git add tests/immofinder-p0.test.mjs server/immofinderCore.ts
          git commit -m "fix(immofinder): p0 leanCfg maxCandidates=4; repair stamp test 130.6.5; portal index rule" || echo no changes
          git push origin HEAD:main
