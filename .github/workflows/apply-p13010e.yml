name: apply-p13010e
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-p13010e-product.mjs
      - name: commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderPipeline.ts server/immofinderCore.ts server/immofinderRepair.ts package.json package-lock.json CHANGELOG.md
          git diff --cached --stat
          git commit -m "fix(immofinder): P130.10e Homegate listingId + price band + rooms first-hit" || echo no-change
          git push
