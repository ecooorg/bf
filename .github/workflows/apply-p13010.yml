name: apply-p13010
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-p13010-immofinder.mjs
      - name: Commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderCore.ts server/immofinderDiscovery.ts server/immofinderPipeline.ts server/immofinderRepair.ts server/immofinderFetcher.ts package.json package-lock.json CHANGELOG.md scripts/apply-p13010-immofinder.mjs
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "fix(immofinder): P130.10 Homegate list→detail expansion, price main-rent, challenge Jina"
          git push
