name: Diagnostic report
description: Build the assistant handoff report from step logs, print it to the run summary and upload it as an artifact.
inputs:
  logs-dir: { description: 'Directory with step logs', required: true }
  artifact-name: { description: 'Artifact name', required: true }
  status: { description: 'job.status of the calling job', required: true }
  rerun: { description: 'Commands that reproduce this workflow locally', required: false, default: '' }
runs:
  using: composite
  steps:
    - name: Build assistant report
      shell: bash
      run: |
        node scripts/diagnostics-summary.mjs || echo "Report generation failed; raw logs are still uploaded."
        if [ -f "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" ]; then cat "$CI_LOGS_DIR/ASSISTANT_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
      env:
        CI_LOGS_DIR: ${{ inputs.logs-dir }}
        CI_STATUS: ${{ inputs.status }}
        WORKFLOW_RERUN: ${{ inputs.rerun }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
    - name: Upload assistant report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.logs-dir }}/ASSISTANT_SUMMARY.md
          ${{ inputs.logs-dir }}/*.log
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
