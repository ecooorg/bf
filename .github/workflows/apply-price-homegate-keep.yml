name: apply-price-homegate-keep
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-price-homegate-keep.mjs
      - name: commit
        run: |
          git config user.name "biforge-bot"
          git config user.email "341088617+biforge-control[bot]@users.noreply.github.com"
          git add server/immofinderRepair.ts server/immofinderPipeline.ts package.json package-lock.json CHANGELOG.md
          git diff --cached --stat
          git commit -m "fix(immofinder): P130.10f labelled rent soft-pick + Homegate 400-ids + quote confirm" || echo no-change
          git push
